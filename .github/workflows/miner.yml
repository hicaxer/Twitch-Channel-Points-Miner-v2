name: Twitch Miner (tkd-alex) Multi-Account

on:
  schedule:
    # Автозапуск каждые 3 часа
    - cron: '0 */3 * * *'
  workflow_dispatch: # Кнопка для ручного запуска из приложения

jobs:
  account-1:
    name: "Аккаунт 1"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Установка форка tkd-alex
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/tkd-alex/TwitchChannelPointsMiner.git

      - name: Запуск майнера
        env:
          TWITCH_TOKEN: ${{ secrets.TWITCH_TOKEN_1 }}
        run: python run.py

  account-2:
    name: "Аккаунт 2"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Установка форка tkd-alex
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/tkd-alex/TwitchChannelPointsMiner.git

      - name: Запуск майнера
        env:
          TWITCH_TOKEN: ${{ secrets.TWITCH_TOKEN_2 }}
        run: python run.py
